<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OptiRoute | Weekly distribution planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="rail" aria-label="Planning steps">
      <a class="brand" href="/" title="Back to the OptiRoute home page" style="text-decoration:none;color:inherit">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 24 L12 10 L20 18 L28 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="4" cy="24" r="3" fill="currentColor"/><circle cx="28" cy="6" r="3" fill="currentColor"/>
        </svg>
        <div>
          <div class="brand-name">OptiRoute</div>
          <div class="brand-sub">Weekly distribution planner</div>
        </div>
      </a>

      <div class="rail-label">This week's plan</div>
      <ol class="steps" id="steps"></ol>

      <div class="rail-label">Reference</div>
      <nav class="links" id="links"></nav>

      <div class="rail-foot">
        <div class="mode" id="mode" role="status"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Open steps">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="crumb" id="crumb"></div>
        <button class="ghost-btn" id="tourBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.2" fill="currentColor"/></svg>
          How it works
        </button>
      </header>
      <div class="banner" id="banner" hidden></div>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <div class="tour" id="tour" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/vendor/anime.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
